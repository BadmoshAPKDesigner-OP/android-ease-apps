<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Apps</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #08080a;
            color: #f3f3f6;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(138, 43, 226, 0.12) 0%, rgba(0,0,0,0) 70%);
            top: 10%;
            left: 20%;
            z-index: 0;
            filter: blur(50px);
        }
        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 300;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
            color: #ffffff;
        }
        .subtitle {
            font-size: 0.95rem;
            color: #8a8a93;
            line-height: 1.6;
            font-weight: 300;
            margin-bottom: 48px;
        }
        .app-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            width: 100%;
        }
        @media (min-width: 480px) {
            .app-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        .app-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 24px;
            padding: 30px 24px;
            text-align: center;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .app-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            background: rgba(255, 255, 255, 0.04);
        }
        .card-icon {
            width: 54px;
            height: 54px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        .card-icon svg {
            width: 24px;
            height: 24px;
            stroke: #ffffff;
            stroke-width: 1.5;
            fill: none;
        }
        .card-title {
            font-size: 1.25rem;
            font-weight: 400;
            color: #ffffff;
            margin-bottom: 6px;
        }
        .card-desc {
            font-size: 0.85rem;
            color: #8a8a93;
            font-weight: 300;
            line-height: 1.4;
            margin-bottom: 24px;
            min-height: 40px;
        }
        .btn-download {
            width: 100%;
            padding: 12px 20px;
            background: #ffffff;
            color: #000000;
            text-decoration: none;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            transition: background 0.2s, transform 0.1s;
        }
        .btn-download:hover {
            background: #e5e5ea;
        }
        .btn-download:active {
            transform: scale(0.98);
        }
        .meta-footer {
            display: block;
            margin-top: 48px;
            font-size: 0.75rem;
            color: #48484a;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Android Ease Apps</h1>
        <p class="subtitle">Premium mobile architecture utility hub.</p>
        
        <div class="app-grid">
            
            <!-- LOGIX CARD -->
            <div class="app-card">
                <div class="card-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                </div>
                <h2 class="card-title">Logix</h2>
                <p class="card-desc">Advanced systems optimization and deployment utility.</p>
                <!-- Right-click your Logix APK asset on GitHub, copy link, and paste it over the href below -->
                <a href="https://github.com/BadmoshAPKDesigner-OP/android-ease-apps/releases/download/v1.0.0/logix_.apk" class="btn-download">Download Logix</a>
            </div>

            <!-- PROMPTLOGIC CARD -->
            <div class="app-card">
                <div class="card-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                </div>
                <h2 class="card-title">PromptLogic</h2>
                <p class="card-desc">Smart accessibility logic configurations for Android.</p>
                <!-- Right-click your PromptLogic APK asset on GitHub, copy link, and paste it over the href below -->
                <a href="https://github.com/BadmoshAPKDesigner-OP/android-ease-apps/releases/download/v1.1.0/promptlogic_.apk" class="btn-download">Download PromptLogic</a>
            </div>

        </div>
        
        <span class="meta-footer">Ecosystem Repository Control</span>
    </div>

</body>
</html>
